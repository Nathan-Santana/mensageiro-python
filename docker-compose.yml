x-app: &app-base
  build: ./app
  image: msg-app:1.0
  restart: unless-stopped
  networks: [msgnet]
  volumes:
    - msgdata:/data

services:
  app1:
    <<: *app-base
    container_name: app1
    environment:
      NODE_NAME: app1
      PEERS: "app2:5000,app3:5000"
    ports: ["5001:5000"]

  app2:
    <<: *app-base
    container_name: app2
    environment:
      NODE_NAME: app2
      PEERS: "app1:5000,app3:5000"
    ports: ["5002:5000"]

  app3:
    <<: *app-base
    container_name: app3
    environment:
      NODE_NAME: app3
      PEERS: "app1:5000,app2:5000"
    ports: ["5003:5000"]

volumes:
  msgdata:

networks:
  msgnet:
    driver: bridge
